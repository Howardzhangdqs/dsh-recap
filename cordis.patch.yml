# dsh-recap bundle patch
#
# The `dsh.bundle.patch` layer of the published npm package: when installed
# through the official CLI —
#
#   dsh plugin --profile <name> add dsh-recap@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-recap` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row).
#
# If the profile already carries a manual mount line in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting.
- insert:
    - id: recap
      name: 'dsh-recap'
